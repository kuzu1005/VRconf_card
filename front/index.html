<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>名刺づくり</title>
</head>
<body>
    <header>VR Chat 名刺ジェネレーター</header>
    <main>
        <h1>名刺を作ろう！</h1>
        
        <div class="container">
            <!-- 入力フォームエリア -->
            <div class="form-area">
                <form id="card-form">
                    <div class="form-group">
                        <label for="name">名前 (10文字以内):</label>
                        <input type="text" id="name" name="name" required maxlength="10" placeholder="例: 佐藤 太郎">
                    </div>

                    <div class="form-group">
                        <label for="inVRC">VRChat ID:</label>
                        <input type="text" id="inVRC" name="inVRC" required placeholder="例: satotaro">
                    </div>

                    <div class="form-group">
                        <label for="file-img">プロフィール画像:</label>
                        <input type="file" id="file-img" name="file-img" accept="image/*" required>
                    </div>

                    <div class="form-group">
                        <label for="message">メッセージ:</label>
                        <textarea id="message" name="message" rows="4" placeholder="一言メッセージを入力..."></textarea>
                    </div>
                </form>
            </div>

            <!-- プレビューエリア -->
            <div class="preview-area">
                <h3 class="card-title">プレビュー</h3>
                <div id="preview-canvas-container"></div>
                <p class="hint">画像を選択し、名前を入力するとプレビューが更新されます</p>
                
                <button type="submit" id="main-submit" form="card-form">作成！</button>
            </div>
        </div>
    </main>

    <!-- p5.js ライブラリ -->
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
    <!-- ロジック -->
    <script src="sketch.js"></script>
    <script type="module" src="index.js"></script>
</body>
</html>
